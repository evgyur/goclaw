name: haraldr-goclaw

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: haraldr_goclaw
      POSTGRES_USER: haraldr_goclaw
      POSTGRES_PASSWORD: ${HARALDR_GOCLAW_POSTGRES_PASSWORD:?required}
    volumes:
      - haraldr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haraldr_goclaw -d haraldr_goclaw"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The official entrypoint initializes the volume as root, then drops to postgres.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    networks: [haraldr-internal]
    restart: unless-stopped

  goclaw:
    image: haraldr-goclaw-runtime:95b66ca50d00a7c722745d8528e69c22e5ccb865
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        ENABLE_EMBEDUI: "true"
        ENABLE_PYTHON: "false"
        ENABLE_FULL_SKILLS: "false"
        VERSION: 95b66ca50d00a7c722745d8528e69c22e5ccb865
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:19972:18790"
    environment:
      GOCLAW_HOST: 0.0.0.0
      GOCLAW_PORT: "18790"
      GOCLAW_CONFIG: /app/config/config.json5
      GOCLAW_DATA_DIR: /app/data
      GOCLAW_WORKSPACE: /app/workspace
      GOCLAW_POSTGRES_DSN: postgres://haraldr_goclaw:${HARALDR_GOCLAW_POSTGRES_PASSWORD:?required}@postgres:5432/haraldr_goclaw?sslmode=disable
      GOCLAW_GATEWAY_TOKEN: ${HARALDR_GOCLAW_GATEWAY_TOKEN:?required}
      GOCLAW_ENCRYPTION_KEY: ${HARALDR_GOCLAW_ENCRYPTION_KEY:?required}
      GOCLAW_PROVIDER: openai
      GOCLAW_MODEL: h20-gpt
      GOCLAW_OPENAI_BASE_URL: https://keys.human20.app/v1
      GOCLAW_OPENAI_API_KEY: ${H20_KEYS_API_KEY:?required}
      GOCLAW_TRACE_VERBOSE: "0"
      TRADER20_HYPERLIQUID_INFO_URL: https://api.hyperliquid.xyz/info
      TRADER20_HYPERLIQUID_ACCOUNT: "0xce9A8BFe7f5A5A6DeAc8bcE0033d5335F3a2986d"
      TRADER20_CANDIDATE_SHA: ${TRADER20_CANDIDATE_SHA:?required}
      TRADER20_POLICY_HASH: ${TRADER20_POLICY_HASH:?required}
      TRADER20_MAX_STALENESS_SECONDS: "30"
    configs:
      - source: haraldr-goclaw-config
        target: /app/config/config.json5
        mode: 0444
    volumes:
      - haraldr-goclaw-data:/app/data
      - haraldr-goclaw-workspace:/app/workspace
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN"]
    networks: [haraldr-internal, haraldr-code-runner-internal]
    restart: unless-stopped

  code-runner:
    image: haraldr-code-runner:a04-v1
    build:
      context: ../..
      dockerfile: deploy/haraldr-goclaw/code-runner/Dockerfile
    user: "65532:65532"
    environment:
      CODING_EXEC_ROOT: /workspace
      CODING_EXEC_LISTEN: 0.0.0.0:8090
      CODING_EXEC_MAX_OUTPUT_BYTES: "65536"
    volumes:
      - haraldr-goclaw-workspace:/workspace:rw
    read_only: true
    tmpfs:
      # Go tests execute their generated test binary from GOCACHE under /tmp.
      - /tmp:rw,exec,nosuid,size=256m,uid=65532,gid=65532,mode=0700
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.50
    networks: [haraldr-code-runner-internal]
    restart: "no"

configs:
  haraldr-goclaw-config:
    file: ./config.json5

volumes:
  haraldr-postgres-data:
    name: haraldr-goclaw-postgres-data
  haraldr-goclaw-data:
    name: haraldr-goclaw-data
  haraldr-goclaw-workspace:
    name: haraldr-goclaw-workspace

networks:
  haraldr-internal:
    name: haraldr-goclaw-internal
    driver: bridge
    ipam:
      config:
        - subnet: 10.253.83.0/28
  haraldr-code-runner-internal:
    name: haraldr-code-runner-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.253.84.0/29
